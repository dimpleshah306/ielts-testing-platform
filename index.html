<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universal Education IELTS Testing Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--muted:#64748b;--green:#15803d;--red:#dc2626;--amber:#b45309}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#0f172a}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
    .brand{font-size:22px;font-weight:800}.subbrand{font-size:13px;opacity:.8}.userbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .shell{max-width:1480px;margin:0 auto;padding:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%)}.tabs{display:flex;gap:8px;margin:18px 0}.tab{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}textarea{min-height:110px;resize:vertical}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.warning{background:#fef3c7;color:#92400e}
    .actions{display:flex;gap:8px;flex-wrap:wrap}.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.dashbtn{padding:24px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px}.dashbtn strong{display:block;font-size:18px;margin-top:8px}.muted{color:var(--muted)}.notice{padding:12px 14px;border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;margin:10px 0}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table-wrap{overflow:auto}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}
    .section-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.section-tabs button.active{background:var(--blue);color:#fff}
    .exam-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;max-height:72vh;overflow:auto}.question{padding:14px 0;border-bottom:1px solid var(--line)}.question:last-child{border-bottom:0}.instructions{background:#fff7df;border-radius:8px;padding:12px;white-space:pre-wrap;margin:10px 0}.group{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.audio-box{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:14px}.audio-box audio{width:100%;margin-top:8px}
    .exam-bottom-nav{position:sticky;bottom:0;z-index:1000;margin-top:14px;padding:10px 12px;background:rgba(255,255,255,.98);border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 -4px 16px rgba(15,23,42,.10);backdrop-filter:blur(6px)}
    .exam-nav-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#334155;margin-bottom:7px}.exam-nav-title strong{font-size:14px;color:#0f172a}.exam-nav-title span{color:#64748b}
    .qnav{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.qnav .qnum{min-width:36px;height:32px;padding:4px 8px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:6px;font-weight:700;cursor:pointer;transition:.12s ease;box-shadow:none}.qnav .qnum:hover{transform:translateY(-1px);border-color:#94a3b8}
    /* Question status colours: unanswered = white, answered = green, current = blue, review = orange. */
    .qnav .qnum:not(.answered):not(.current):not(.flagged){background:#fff;color:#0f172a;border-color:#cbd5e1}
    .qnav .qnum.answered{background:#22c55e;color:#fff;border-color:#16a34a}
    .qnav .qnum.flagged{background:#f59e0b;color:#fff;border-color:#d97706}
    .qnav .qnum.current{background:#2563eb!important;color:#fff!important;border-color:#1d4ed8!important;box-shadow:0 0 0 2px rgba(37,99,235,.20);transform:translateY(-1px)}
    .qnav .qnum.current.flagged{background:#2563eb!important;color:#fff!important;border-color:#f59e0b!important;box-shadow:0 0 0 2px rgba(245,158,11,.28),0 0 0 4px rgba(37,99,235,.12)}
    .exam-status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#334155;margin-top:7px}.exam-status-row>span:not(.legend){padding:3px 7px;border-radius:6px;background:#f8fafc}.exam-status-row .legend{display:inline-flex;align-items:center;gap:5px;font-weight:700}.exam-status-row .legend:before{content:"";width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid #cbd5e1}.exam-status-row .green-dot:before{background:#22c55e;border-color:#16a34a}.exam-status-row .blue-dot:before{background:#2563eb;border-color:#1d4ed8}.exam-status-row .orange-dot:before{background:#f59e0b;border-color:#d97706}.exam-status-row .white-dot:before{background:#fff}
    .exam-nav-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}.exam-nav-actions .actions{margin-left:auto}
    .timer{font-weight:800;font-size:18px}.writing-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:12px}.writing-answer{min-height:55vh;line-height:1.6;font-size:16px}
    .editor-block{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#fff}.answer-options{margin-top:8px;padding:8px;border-radius:8px;background:#f8fafc;border:1px solid var(--line);font-size:12px}.missing-row{background:#fff7df}.media-upload-box{border:1px dashed #94a3b8;border-radius:10px;padding:14px;margin:12px 0;background:#f8fafc}.media-upload-box input[type="file"]{display:block;margin-top:8px;width:100%;padding:10px;background:#fff;border:1px solid #cbd5e1;border-radius:8px}.inline-help{font-size:12px;color:var(--muted)}
    img.media{display:block;max-width:560px;max-height:360px;width:auto;height:auto;object-fit:contain;border-radius:8px;margin:10px auto}
    @media(max-width:900px){.dashboard-grid,.grid,.grid3,.exam-split,.writing-grid{grid-template-columns:1fr}.pane{max-height:none}.shell{padding:12px}}
  </style>
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="card login-card">
        <h1 style="margin:0">Universal Education IELTS</h1>
        <p class="muted">Testing Platform</p>
        <div class="tabs">
          <button id="studentTab" class="tab active" type="button">Student</button>
          <button id="staffTab" class="tab" type="button">Admin / Tutor</button>
        </div>
        <form id="loginForm">
          <label id="loginIdLabel">Student ID</label>
          <input id="loginId" type="text" autocomplete="username" required placeholder="e.g. STU001">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="loginButton" class="btn primary" style="width:100%;margin-top:16px" type="submit">Login</button>
          <div id="loginMessage" style="margin-top:12px"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js?v=12.5.3-bottom-nav-highlight-status-fix"></script>
</body>
</html>
