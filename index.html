<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Education IELTS Testing Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#0f172a}.app-shell{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(15,23,42,.12)}.login-card h1{margin:0 0 6px}.login-card p{color:#64748b}.login-tabs{display:flex;gap:8px;margin:20px 0}.login-tabs button{flex:1;padding:11px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;cursor:pointer}.login-tabs button.active{background:#0f172a;color:#fff}.login-card label,.student-form label{display:block;font-weight:600;margin:12px 0}.login-card input,.student-form input,.student-form textarea,.student-form select,.grid input,.grid textarea,.grid select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px;font:inherit}.login-card button[type=submit],button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.login-card button[type=submit],.save-button{background:#0f172a;color:#fff}.cancel-button{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.dashboard{min-height:100vh}.dashboard-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 24px;background:#0f172a;color:#fff}.dashboard-header h1{margin:0;font-size:22px}.dashboard-header p{margin:3px 0 0;color:#cbd5e1}.dashboard-content{padding:24px}.user-area{display:flex;align-items:center;gap:12px}.user-area button{background:#fff;color:#0f172a}.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.dashboard-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;text-align:left;min-height:130px;box-shadow:0 4px 16px rgba(15,23,42,.05)}.dashboard-card .card-icon{font-size:30px;display:block;margin-bottom:12px}.dashboard-card strong{display:block;font-size:18px}.dashboard-card small{color:#64748b}.students-panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.students-panel-header{display:flex;justify-content:space-between;gap:12px;align-items:center}.students-panel-header h2{margin:0}.students-table{width:100%;border-collapse:collapse;background:#fff}.students-table th,.students-table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.muted{color:#64748b}.login-message{min-height:22px;margin-top:10px}.coming-soon{padding:20px;background:#fff;border:1px dashed #cbd5e1;border-radius:10px}@media(max-width:700px){.dashboard-header{padding:14px;align-items:flex-start}.dashboard-content{padding:14px}.dashboard-header{flex-direction:column}.user-area{width:100%;justify-content:flex-end}}
  </style>
</head>
<body>
<div id="app" class="app-shell">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Universal Education IELTS</h1>
      <p>Testing Platform</p>
      <div class="login-tabs">
        <button id="studentTab" class="active" type="button">Student</button>
        <button id="staffTab" type="button">Admin / Tutor</button>
      </div>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginButton" type="submit" style="width:100%;margin-top:10px">Login</button>
      </form>
      <div id="loginMessage" class="login-message"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
