<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universal Education IELTS Testing Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
  <link rel="stylesheet" href="style.css?v=13.1.8-final">
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="card login-card">
        <h1 style="margin:0">Universal Education IELTS</h1>
        <p class="muted">Testing Platform</p>
        <div class="tabs">
          <button id="studentTab" class="tab active" type="button">Student</button>
          <button id="staffTab" class="tab" type="button">Admin / Tutor</button>
        </div>
        <form id="loginForm">
          <label id="loginIdLabel">Student ID</label>
          <input id="loginId" type="text" autocomplete="username" required placeholder="e.g. STU001">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="loginButton" class="btn primary" style="width:100%;margin-top:16px" type="submit">Login</button>
          <div id="loginMessage" style="margin-top:12px"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js?v=13.1.8-writing-evaluation-fix-final"></script>
</body>
</html>
