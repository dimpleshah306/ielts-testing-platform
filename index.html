<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Universal Education IELTS Testing Platform"
    >

    <meta
        name="theme-color"
        content="#173f8a"
    >

    <title>
        Universal Education IELTS Testing Platform
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <!-- Supabase JavaScript Library -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


    <!-- =========================================
         APPLICATION
         ========================================= -->

    <div id="app">

        <main class="login-page">

            <section class="login-card">


                <!-- =================================
                     BRAND
                     ================================= -->

                <div class="brand">

                    <div class="brand-logo">
                        UE
                    </div>

                    <h1>
                        Universal Education
                    </h1>

                    <p>
                        IELTS Testing Platform
                    </p>

                </div>


                <!-- =================================
                     LOGIN TABS
                     ================================= -->

                <div class="login-tabs">

                    <button
                        id="studentTab"
                        class="login-tab active"
                        type="button"
                    >
                        Student Login
                    </button>


                    <button
                        id="staffTab"
                        class="login-tab"
                        type="button"
                    >
                        Admin / Tutor
                    </button>

                </div>


                <!-- =================================
                     LOGIN FORM
                     ================================= -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >
                        Login
                    </button>


                </form>


                <!-- =================================
                     LOGIN MESSAGE
                     ================================= -->

                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <!-- =================================
                     FOOTER
                     ================================= -->

                <div class="login-footer">

                    <p>
                        Universal Education
                    </p>

                    <span>
                        IELTS Testing Platform
                    </span>

                </div>


            </section>

        </main>

    </div>


    <!-- =========================================
         APPLICATION JAVASCRIPT
         ========================================= -->

    <script src="app.js"></script>


</body>

</html>
